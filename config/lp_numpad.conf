# Deep sleep after 30 min idle (any key wakes it; the first press is swallowed)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Windows reconnect fix (2026-11-25): after every power cycle Windows flipped between "Connected" and
# "Driver error" until the numpad was removed and re-paired. ZMK documents this one as a workaround for a
# Windows bug with battery notifications.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# In ZMK v0.3 this only disables 2M PHY, which ZMK's docs say helps some Windows Bluetooth chips connect.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
