units:
  extra_spread: 0
  extra_padding: 0
  board_expand: 0.25 # 18mm keycaps on 19mm pitch: 1mm gap to the case wall (0.25 PCB tolerance)

  # Physical measures
  screw_radius: 1.1 # M2 screws
  screw_diameter: screw_radius * 2
  screw_head_radius: 2.05
  screw_head_diameter: screw_head_radius * 2
  spacer_radius: 2.15 # M2 standoffs
  spacer_diameter: spacer_radius * 2
  fillet_radius: 0.5

  # Case variables
  case_wall_thickness: 1.2
  pcb_to_case_wall_tolerance: 0.25
  bottom_plate_thickness: 1.0
  top_plate_thickness: 1.6
  internal_distance_between_plates: 4
points:
  zones:
    # Main key matrix
    matrix:
      key:
        spread: u + extra_spread
        padding: u + extra_padding
        tags:
          - key
      anchor:
        shift: [100, -100] # Fix KiCad placement
      columns:
        c1:
          key.column_net: C1
          rows.r6:
            width: 2u
            adjust.shift: [0.5u, 0]
        c2:
          key.column_net: C2
          rows.r6.skip: true
        c3:
          key.column_net: C3
        c4:
          key.column_net: C4
          rows:
            r3:
              height: 2u
              adjust.shift: [0, -0.5u]
            r4.skip: true
            r5:
              height: 2u
              adjust.shift: [0, -0.5u]
            r6.skip: true
      rows:
        r6:
          row_net: R6
        r5:
          row_net: R5
        r4:
          row_net: R4
        r3:
          row_net: R3
        r2:
          row_net: R2
        r1:
          row_net: R1
    screw_pcb_left_top:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: matrix_c1_r2
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2]
    screw_pcb_right_top:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: matrix_c4_r1
          shift: [-(u + extra_spread) / 2, -(u + extra_padding) / 2]
    screw_pcb_right_bottom:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: matrix_c4_r6
          # one row further back than the key corner: the lower tall key's stabilizer bar runs
          # through the corner position
          shift: [-(u + extra_spread) / 2, (u + extra_padding) / 2 + u]
    screw_pcb_left_bottom:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: matrix_c3_r6
          # key crossing just right of the "0" key: past the end of its stabilizer bar
          shift: [-(u + extra_spread) / 2, (u + extra_padding) / 2]
    screw_pcb_center:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: matrix_c2_r3
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2]
outlines:
  _keycaps:
    - what: rectangle
      where: [key]
      size: 18
      fillet: 1
  _switches:
    - what: rectangle
      where: [key]
      size: 14
  _screws:
    - what: circle
      where: /screw_pcb/
      radius: screw_radius
  _screw_heads:
    - what: circle
      where: /screw_pcb/
      radius: screw_head_radius
  _spacers:
    - what: circle
      where: /screw_pcb/
      radius: spacer_radius
  _matrix_outline:
    - what: polygon
      points:
        - ref: matrix_c1_r1
          shift: [-u/2, u/2]
        - ref: matrix_c4_r1
          shift: [u/2, u/2]
        - ref: matrix_c4_r5
          shift: [u/2, -u]
        - ref: matrix_c1_r6
          shift: [-u, -u/2]
  _board_outline:
    - what: outline
      name: _matrix_outline
      expand: board_expand

  _stab_holes:
    # Gateron LP plate-mount stabilizer (KS-57B210T, from its STEP model). Per 2u key: two housing
    # cutouts (6.5 x 15.45, offset 2.275 toward the bar) joined by a 1.6 slot for the bar, which hangs
    # 0.225mm into the PCB. Bars point inward (toward the board centre).
    - what: rectangle
      where: matrix_c1_r6
      size: [6.5, 15.45]
      adjust.shift: [12, 2.275]
    - what: rectangle
      where: matrix_c1_r6
      size: [6.5, 15.45]
      adjust.shift: [-12, 2.275]
    - what: rectangle
      where: matrix_c1_r6
      size: [24, 1.6]
      adjust.shift: [0, 7.975]
    - what: rectangle
      where: [matrix_c4_r3, matrix_c4_r5]
      size: [15.45, 6.5]
      adjust.shift: [-2.275, 12]
    - what: rectangle
      where: [matrix_c4_r3, matrix_c4_r5]
      size: [15.45, 6.5]
      adjust.shift: [-2.275, -12]
    - what: rectangle
      where: [matrix_c4_r3, matrix_c4_r5]
      size: [1.6, 24]
      adjust.shift: [-7.975, 0]
  _pcb_outline:
    - what: outline
      name: _board_outline
    - what: outline
      name: _stab_holes
      operation: subtract

  not_about_money_outline:
    - what: outline
      name: _board_outline
    - what: outline
      name: _screws
      operation: stack

  _top_case_outer_outline:
    - what: outline
      name: _board_outline
      expand: case_wall_thickness + pcb_to_case_wall_tolerance
      fillet: 0.5
      joints: 1
  _top_case_inner_outline:
    - what: outline
      name: _board_outline
      expand: pcb_to_case_wall_tolerance
      fillet: 0.5
      joints: 1
  top_case_inner_plate:
    - what: outline
      name: _top_case_inner_outline
    - what: outline
      name: _switches
      operation: subtract
  _top_case_walls:
    - what: outline
      name: _top_case_outer_outline
    - what: outline
      name: _top_case_inner_outline
      operation: subtract

  _bottom_case_superlight_inner_outline:
    - what: outline
      name: _board_outline
      expand: -2 * case_wall_thickness
      fillet: 0.5
      joints: 1
  _bottom_case_outer_outline:
    - what: outline
      name: _board_outline
      expand: case_wall_thickness + pcb_to_case_wall_tolerance
      fillet: 0.5
      joints: 1
  _bottom_case_inner_outline:
    - what: outline
      name: _board_outline
      expand: pcb_to_case_wall_tolerance
      fillet: 0.5
      joints: 1
  _bottom_case_walls:
    - what: outline
      name: _bottom_case_outer_outline
    - what: outline
      name: _bottom_case_inner_outline
      operation: subtract

  preview:
    - what: outline
      name: _board_outline
    - what: outline
      name: _keycaps
      operation: stack
    - what: outline
      name: _screws
      operation: stack
    - what: outline
      name: _switches
      operation: stack
    - what: outline
      name: _screw_heads
      operation: stack
    - what: outline
      name: _top_case_walls
      operation: stack
    - what: outline
      name: _top_case_outer_outline
      operation: stack
pcbs:
  not_about_money:
    template: kicad8
    outlines:
      main:
        outline: _pcb_outline
    footprints:
      m2_screws:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: screw_diameter
          hole_drill: screw_diameter

      key_switches:
        what: ceoloide/switch_gateron_ks27_ks33
        where: [[/key/, -matrix_c1_r6, -matrix_c4_r3, -matrix_c4_r5]]
        params: &switch_params
          side: B
          reversible: false
          hotswap: true
          solder: false
          include_corner_marks: false
          from: "{{column_net}}"
          to: "{{colrow}}"

      key_switch_0:
        # 2u "0" key: socket turned so its pads stay clear of the stabilizer cutout
        # (the cross stem works in any 90 deg orientation); outer pads trimmed to 1.6
        what: ceoloide/switch_gateron_ks27_ks33
        where: matrix_c1_r6
        params:
          <<: *switch_params
          outer_pad_width_back: 1.6
          outer_pad_width_front: 1.6
        adjust:
          rotate: 0

      key_switch_tall:
        # 2u vertical keys: same treatment
        what: ceoloide/switch_gateron_ks27_ks33
        where: [matrix_c4_r3, matrix_c4_r5]
        params:
          <<: *switch_params
          outer_pad_width_back: 1.6
          outer_pad_width_front: 1.6
        adjust:
          rotate: 90

      diodes:
        what: ceoloide/diode_tht_sod123
        where: /key/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          include_tht: false
          reversible: false
          side: B
        adjust:
          shift: [7.1, 1.25]
          rotate: 90

      mcu:
        # Back side, USB pointing up at the top edge. x is chosen so every used pin
        # clears the hotswap sockets; the 6 unused pins that would overlap switch
        # pads are left out (don't fit header pins there).
        what: custom/mcu_nice_nano_sparse
        where: matrix_c2_r1
        params:
          omit_pins: "P21,P20,P10,P2,P3,P9,VCC,#4"
          P19: C1
          P18: C2
          P15: C3
          P14: C4
          P16: R1
          P4: R2
          P5: R3
          P6: R4
          P7: R5
          P8: R6
          P1_label: " "
          P0_label: " "
          P2_label: " "
          P3_label: " "
          P9_label: " "
          P10_label: " "
          P20_label: " "
          P21_label: " "
          RAW_label: "B+"
          GND_label: "GN"
          RST_label: "RS"
          VCC_label: "V+"
          side: B
          show_silk_labels_on_both_sides: false
        adjust:
          shift: [2.44, -6.5 - (2 - board_expand)]

      on_off_switch:
        # Back side, lever pointing up, 20mm from the right edge
        what: ceoloide/power_switch_smd_side
        where: matrix_c4_r1
        params:
          side: B
          from: BAT_P
          to: RAW
        adjust:
          shift: [-8.5, 9.705 - (2 - board_expand)]
          rotate: 90

      reset_switch:
        # Back side, button pointing up, between the MCU and the power switch
        what: ceoloide/reset_switch_smd_side
        where: matrix_c3_r1
        params:
          side: B
          from: GND
          to: RST
          include_bosses: true
        adjust:
          shift: [-0.8, u/2 + board_expand - 2.25]

      battery_connector:
        what: ceoloide/battery_connector_jst_ph_2
        where: matrix_c2_r2
        params:
          side: B
          BAT_P: BAT_P
          BAT_N: GND
          include_courtyard: false
        adjust:
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2 + 1]
          rotate: 90

      battery_led:
        # Low-battery LED, front side, at the keycap-gap crossing between c2/c3 and r4/r5.
        # Any 0603 LED up to ~1.4 tall (planned: Lite-On LTST-C191KRKT, 0.55): the plate has a 0.6 deep
        # counterbore over it (1.6 of room) and a hole so the light comes out between the keycaps.
        what: custom/smd_0603
        where: matrix_c2_r4
        params:
          designator: LED
          side: F
          from: LED_A
          to: GND
        adjust:
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2]

      battery_led_resistor:
        # 1k series resistor for the LED, back side, right under it. Driven by spare pin P0.
        what: custom/smd_0603
        where: matrix_c2_r4
        params:
          designator: R
          side: B
          polarized: false
          from: P0
          to: LED_A
        adjust:
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2]

      jlcpcb_order_number_text:
        what: ceoloide/utility_text
        where: matrix_c3_r4
        params:
          side: B
          mirrored: true
          text: JLCJLCJLCJLC
        adjust:
          shift: [u/2, -5]

      board_version_text:
        what: ceoloide/utility_text
        where: matrix_c3_r2
        params:
          side: B
          mirrored: true
          text: "'Not about money' v0.1 by ceoloide"
        adjust:
          shift: [(u + extra_spread) / 2, -(u + extra_padding) / 2 + 4]
cases:
  case_top:
    - what: outline
      name: _top_case_walls
      extrude: (bottom_plate_thickness + internal_distance_between_plates + top_plate_thickness)
      shift: [0, 0, 0]
    - what: outline
      name: top_case_inner_plate
      extrude: -top_plate_thickness
      shift: [0, 0, 0]
